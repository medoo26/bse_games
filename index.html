<style>
  html, body { font-family: 'Cairo', 'Tajawal', system-ui, sans-serif; }
  body { -webkit-tap-highlight-color: transparent; background: #F8FAFC; }
  .kiosk-noselect { -webkit-user-select: none; user-select: none; }
  input, textarea, select { -webkit-user-select: text; user-select: text; }
  .tap { transition: transform .15s ease, box-shadow .2s ease, background-color .2s ease, opacity .2s; }
  .tap:active { transform: scale(.96); }
  .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  .fade-in { animation: fadeIn .35s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .pop-in { animation: popIn .25s ease both; }
  @keyframes popIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  .spinner { width: 56px; height: 56px; border-radius: 50%; border: 6px solid #DBEAFE; border-top-color: #3B82F6; animation: spin 1s linear infinite; }
  .spinner-sm { width: 22px; height: 22px; border-width: 3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .shimmer { background: linear-gradient(90deg, #eef2f7 0%, #f8fafc 50%, #eef2f7 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .cover-pattern { background-image: radial-gradient(rgba(255,255,255,.18) 1.5px, transparent 1.5px); background-size: 18px 18px; }
  .hero-grid { background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px); background-size: 32px 32px; }
  .card-thumb img { transition: transform .5s ease; }
  .card:hover .card-thumb img { transform: scale(1.04); }
  #idleRing { transition: stroke-dashoffset 1s linear; }
  .fld { display:block; width:100%; margin-top:.4rem; height:3.25rem; border-radius:.85rem; border:1px solid #cbd5e1; padding:0 1rem; font-size:1rem; background:#fff; color:#1B2A59; }
  .fld:focus { outline:none; border-color:#3B82F6; box-shadow:0 0 0 4px #DBEAFE; }
  textarea.fld { height:auto; resize:vertical; padding-top:.75rem; padding-bottom:.75rem; }
  .ppt-grad { background: linear-gradient(135deg, #f97316 0%, #ea580c 45%, #c2410c 100%); }
</style>

/* ======================= STATE / HELPERS ======================= */
const state = { lang: DEFAULT_LANG, filter: 'all', projects: [], loaded: false, current: null, connected: false };
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const t = (k, vars) => { let s = (I18N[state.lang] && I18N[state.lang][k]) ?? I18N.ar[k] ?? k; if (vars) for (const v in vars) s = s.replace('{' + v + '}', vars[v]); return s; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const show = (el) => { el.classList.remove('hidden'); el.classList.add('flex'); };
const hide = (el) => { el.classList.add('hidden'); el.classList.remove('flex'); };
const isOpen = (el) => !el.classList.contains('hidden');
const fmtBytes = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
const extOf = (name) => ((name || '').split('?')[0].split('#')[0].match(/\.([a-z0-9]+)$/i) || [])[1]?.toLowerCase() || '';
const isPptFileUrl = (u) => /\.(ppsx|pptx|pps|ppt)(\?|#|$)/i.test(u || '');
const BUCKET_MARK = `/storage/v1/object/public/${STORAGE_BUCKET}/`;
const storagePathOf = (u) => { if (!u || !u.includes(BUCKET_MARK)) return null; try { return decodeURIComponent(u.split(BUCKET_MARK)[1].split('?')[0].split('#')[0]); } catch (_) { return null; } };

/* ======================= SUPABASE ======================= */
let sb = null;
try {
  if (window.supabase && window.supabase.createClient) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
  }
} catch (e) { console.error(e); }

function explain(err) {
  if (!err) return '';
  const msg = String(err.message || err.error || err || '');
  const code = String(err.code || err.statusCode || err.status || '');
  if (!sb) return t('hintLib');
  if (code === '42P01' || code === 'PGRST205' || /relation .* does not exist|Could not find the table/i.test(msg)) return t('hintTable');
  if (code === '42501' || /row-level security|violates row-level|permission denied|Unauthorized/i.test(msg)) return t('hintRls');
  if (/bucket not found/i.test(msg)) return t('hintBucket');
  if (code === '413' || /payload too large|exceeded the maximum allowed size|too large/i.test(msg)) return t('hintSize');
  if (/Failed to fetch|NetworkError|network/i.test(msg)) return t('hintNet');
  return msg;
}

async function fetchProjects() {
  if (!sb) throw new Error('lib');
  const { data, error } = await sb.from(PROJECTS_TABLE).select('*').order('created_at', { ascending: true });
  if (error) throw error;
  return data || [];
}

async function uploadToStorage(body, folder, ext, contentType) {
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 9)}.${ext}`;
  const { error } = await sb.storage.from(STORAGE_BUCKET).upload(path, body, { contentType, upsert: false, cacheControl: '3600' });
  if (error) throw error;
  return sb.storage.from(STORAGE_BUCKET).getPublicUrl(path).data.publicUrl;
}
async function removeFromStorage(urls) {
  const paths = urls.map(storagePathOf).filter(Boolean);
  if (!paths.length) return;
  try { await sb.storage.from(STORAGE_BUCKET).remove(paths); } catch (e) { console.warn('storage cleanup', e); }
}
function downloadUrlOf(p) {
  const path = storagePathOf(p.project_url);
  if (path && sb) {
    const base = (p.title_en || '').replace(/[^A-Za-z0-9_\- ]+/g, '').trim().replace(/\s+/g, '-').slice(0, 60) || 'presentation';
    return sb.storage.from(STORAGE_BUCKET).getPublicUrl(path, { download: base + '.' + (extOf(path) || 'ppsx') }).data.publicUrl;
  }
  return p.project_url;
}

/* ---------- cache (instant start + offline fallback) ---------- */
function saveCache(list) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(list)); } catch (_) {} }
function readCache() { try { const v = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); return Array.isArray(v) ? v : null; } catch (_) { return null; } }

let loadingNow = false;
async function loadProjects({ silent = false } = {}) {
  if (loadingNow) return;
  loadingNow = true;
  if (!silent && state.loaded) $('#syncBar').classList.replace('hidden', 'flex');
  try {
    const rows = await fetchProjects();
    state.projects = rows; state.loaded = true; state.connected = true; state.loadError = null;
    saveCache(rows);
  } catch (err) {
    console.error(err);
    state.connected = false;
    state.loadError = explain(err);
    if (!state.loaded) {
      const cached = readCache();
      if (cached) { state.projects = cached; state.loaded = true; if (!silent) toast(t('offlineCache')); }
    }
  } finally {
    loadingNow = false;
    $('#syncBar').classList.replace('flex', 'hidden');
    renderFilters(); renderGrid();
    if (isOpen($('#admin'))) { renderAdminList(); renderConn(); }
  }
}
let reloadDebounce = null;
const scheduleReload = () => { clearTimeout(reloadDebounce); reloadDebounce = setTimeout(() => loadProjects({ silent: true }), 600); };

function subscribeRealtime() {
  if (!sb || !sb.channel) return;
  try {
    sb.channel('projects-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: PROJECTS_TABLE }, scheduleReload)
      .subscribe();
  } catch (e) { console.warn('realtime', e); }
}

function normalizeUrl(u) { u = (u || '').trim(); if (u && !/^https?:\/\//i.test(u)) u = 'https://' + u; return u; }
function setViewerHeader(p) {
  $('#vTitle').textContent = pName(p);

}
let slowTimer = null, frameToken = 0;
function setNewTab(url) {
  const a = $('#vNewTab'), b = $('#vSlowNewTab');
  if (url) { a.href = url; b.href = url; a.classList.remove('hidden'); a.classList.add('inline-flex'); b.classList.remove('hidden'); }
  else { a.classList.add('hidden'); a.classList.remove('inline-flex'); b.classList.add('hidden'); }
}
function showSlow(msg) { $('#vSlowMsg').textContent = msg; $('#vSlow').classList.remove('hidden'); }

async function mountFrame(p) {
  const token = ++frameToken;
  const wrap = $('#vFrameWrap');
  wrap.querySelector('iframe')?.remove();
  show($('#vLoader')); $('#vSlow').classList.add('hidden');
  clearTimeout(slowTimer);
  hide($('#pptBar'));

  const f = document.createElement('iframe');
  f.className = 'absolute inset-0 w-full h-full border-0 bg-white';
  f.setAttribute('allow', 'fullscreen; autoplay; microphone; camera; clipboard-read; clipboard-write; speaker-selection; web-share; display-capture; geolocation');
  f.setAttribute('allowfullscreen', '');
  f.setAttribute('title', pName(p));
  f.addEventListener('load', () => {
    if (token !== frameToken) return;
    hide($('#vLoader')); clearTimeout(slowTimer);
    try { // same-origin (srcdoc) → forward activity to the idle timer
      const d = f.contentDocument;
      if (d) ['pointerdown', 'touchstart', 'keydown', 'wheel', 'mousemove'].forEach(ev => d.addEventListener(ev, bumpIdle, { passive: true }));
    } catch (_) {}
  });

  const url = p.project_url || '';
  if (p.project_type === 'html') {
    setNewTab(null);
    wrap.appendChild(f);
    slowTimer = setTimeout(() => showSlow(t('slowHint')), 15000);
    try {
      const res = await fetch(url, { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = new TextDecoder('utf-8').decode(await res.arrayBuffer());
      if (token !== frameToken) return;
      f.srcdoc = text;
    } catch (e) {
      if (token !== frameToken) return;
      clearTimeout(slowTimer);
      showSlow(t('htmlFetchErr') + ' ' + explain(e));
    }
    return;
  }

  if (p.project_type === 'ppsx') {
    if (isPptFileUrl(url)) {
      f.src = 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(url);
      $('#pptDownload').href = downloadUrlOf(p);
      show($('#pptBar'));
      setNewTab(null);
      slowTimer = setTimeout(() => showSlow(t('slowHintPpt')), 15000);
    } else {
      f.src = url;                       // ready-made OneDrive / Office embed link
      setNewTab(url);
      slowTimer = setTimeout(() => showSlow(t('slowHint')), 15000);
    }
    wrap.appendChild(f);
    return;
  }

  const u = normalizeUrl(url);
  f.src = u; setNewTab(u);
  slowTimer = setTimeout(() => showSlow(t('slowHint')), 12000);
  wrap.appendChild(f);
}
function openViewer(id) {
  const p = state.projects.find(x => String(x.id) === String(id));
  if (!p) return;
  state.current = p;
  setViewerHeader(p);
  show($('#viewer'));
  document.body.style.overflow = 'hidden';
  mountFrame(p);
  bumpIdle();
}
function closeViewer() {
  if (!state.current) return;
  frameToken++;
  $('#vFrameWrap').querySelector('iframe')?.remove();
  clearTimeout(slowTimer);
  state.current = null;
  hide($('#viewer')); hide($('#pptBar'));
  if (!isOpen($('#admin'))) document.body.style.overflow = '';
  bumpIdle();
}

/* ======================= IDLE RESET ======================= */
let idleTimer = null, warnInterval = null, warnLeft = 0;
const anyAdminUI = () => isOpen($('#admin')) || isOpen($('#busy')) || isOpen($('#loginDlg'));
function isHomeState() { return !state.current && state.filter === 'all' && state.lang === DEFAULT_LANG && window.scrollY < 10 && !isOpen($('#pinDlg')); }
function bumpIdle() {
  clearTimeout(idleTimer);
  if (isOpen($('#idleWarn'))) stopWarn();
  if (anyAdminUI()) return;
  if (state.current) idleTimer = setTimeout(startWarn, IDLE_MS - WARN_SECONDS * 1000);
  else idleTimer = setTimeout(() => { if (!isHomeState()) goHome(); else { loadProjects({ silent: true }); bumpIdle(); } }, IDLE_MS);
}
function startWarn() {
  warnLeft = WARN_SECONDS; show($('#idleWarn')); updateWarn();
  warnInterval = setInterval(() => { warnLeft--; updateWarn(); if (warnLeft <= 0) { stopWarn(); goHome(); } }, 1000);
}
function updateWarn() {
  $('#idleCount').textContent = Math.max(0, warnLeft);
  $('#idleRing').style.strokeDashoffset = (326.7 * (1 - warnLeft / WARN_SECONDS)).toFixed(1);
}
function stopWarn() { clearInterval(warnInterval); hide($('#idleWarn')); $('#idleRing').style.strokeDashoffset = 0; }
function goHome() {
  closeViewer(); closePin(); hide($('#confirmDlg'));
  state.filter = 'all';
  if (state.lang !== DEFAULT_LANG) { state.lang = DEFAULT_LANG; applyLang(); } else { renderFilters(); renderGrid(); }
  window.scrollTo({ top: 0, behavior: 'smooth' });
  loadProjects({ silent: true });
  bumpIdle();
}
['pointerdown', 'touchstart', 'keydown', 'wheel', 'mousemove', 'scroll'].forEach(ev => window.addEventListener(ev, bumpIdle, { passive: true }));
window.addEventListener('blur', () => setTimeout(() => { if (document.activeElement && document.activeElement.tagName === 'IFRAME') bumpIdle(); }, 0));

let pinBuf = '';
function renderPinDots() {
  const n = Math.max(4, ADMIN_PIN.length);
  $('#pinDots').innerHTML = Array.from({ length: n }, (_, i) => `<span class="w-5 h-5 rounded-full border-2 ${i < pinBuf.length ? 'bg-navy border-navy' : 'border-slate-300'}"></span>`).join('');
}
function buildPinPad() {
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', '⌫'];
  $('#pinPad').innerHTML = keys.map(k => `<button data-k="${k}" class="tap h-16 rounded-2xl text-2xl font-extrabold ${/\d/.test(k) ? 'bg-slate-100 hover:bg-blue-50 text-navy' : 'bg-white border border-slate-200 text-slate-500'}">${k}</button>`).join('');
}
function openPin() { pinBuf = ''; $('#pinErr').textContent = ''; renderPinDots(); show($('#pinDlg')); }
function closePin() { hide($('#pinDlg')); pinBuf = ''; }
async function pinKey(k) {
  $('#pinErr').textContent = '';
  if (k === 'C') pinBuf = '';
  else if (k === '⌫') pinBuf = pinBuf.slice(0, -1);
  else if (pinBuf.length < 8) pinBuf += k;
  renderPinDots();
  if (pinBuf.length === ADMIN_PIN.length) {
    if (pinBuf === ADMIN_PIN) { closePin(); await afterPin(); }
    else {
      $('#pinErr').textContent = t('pinWrong');
      $('#pinDots').animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-10px)' }, { transform: 'translateX(10px)' }, { transform: 'translateX(0)' }], { duration: 300 });
      setTimeout(() => { pinBuf = ''; renderPinDots(); }, 350);
    }
  }
}
async function afterPin() {
  if (REQUIRE_LOGIN && sb) {
    const { data } = await sb.auth.getSession();
    if (!data || !data.session) { $('#loginErr').textContent = ''; show($('#loginDlg')); clearTimeout(idleTimer); return; }
  }
  openAdmin();
}

  show($('#admin')); document.body.style.overflow = 'hidden';
  $('#logoutBtn').classList.toggle('hidden', !REQUIRE_LOGIN);
  showAdminList(); renderConn();
  loadProjects({ silent: true });
}
function closeAdmin() { hide($('#admin')); document.body.style.overflow = ''; form = null; renderFilters(); renderGrid(); bumpIdle(); }
function showAdminList() { $('#pForm').classList.add('hidden'); $('#adminList').classList.remove('hidden'); renderAdminList(); $('#adminScroll').scrollTop = 0; }

function renderAdminList() {
  const list = state.projects;
  if (!state.loaded) { $('#adminItems').innerHTML = `<div class="flex justify-center py-12"><div class="spinner"></div></div>`; return; }
  if (!list.length) { $('#adminItems').innerHTML = `<div class="text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300 text-slate-500 font-bold">${esc(t('noProjects'))}</div>`; return; }
  $('#adminItems').innerHTML = list.map(p => {
    const typeLbl = p.project_type === 'ppsx' ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-orange-50 text-orange-600 font-bold"><i class="fa-solid fa-file-powerpoint"></i> ${esc(t('typePpt'))}</span>`
      : p.project_type === 'html' ? `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 font-bold"><i class="fa-solid fa-code"></i> ${esc(t('typeHtml'))}</span>`
      : `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-blue-50 text-sky1 font-bold"><i class="fa-solid fa-globe"></i> ${esc(t('typeUrl'))}</span>`;
    return `
    <div class="bg-white rounded-2xl border border-slate-200 p-3 flex items-center gap-3">
      <div class="w-24 sm:w-32 aspect-video rounded-xl overflow-hidden shrink-0 bg-slate-100">${thumbHTML(p, false)}</div>
      <div class="flex-1 min-w-0">
        <p class="font-extrabold clamp-1">${esc(pName(p))}</p>
        <p class="text-sm text-slate-500 clamp-1">${esc(pTeacher(p))} • ${esc(stageName(p.grade))}</p>
        <p class="text-xs mt-1">${typeLbl}</p>
      </div>
      <div class="flex flex-col sm:flex-row gap-1.5 shrink-0">
        <button data-edit="${esc(p.id)}" class="tap h-11 px-4 rounded-xl bg-blue-50 text-sky1 font-bold"><i class="fa-solid fa-pen me-1"></i>${esc(t('edit'))}</button>
        <button data-del="${esc(p.id)}" class="tap h-11 px-4 rounded-xl bg-red-50 text-red-600 font-bold"><i class="fa-solid fa-trash me-1"></i>${esc(t('del'))}</button>
      </div>
    </div>`;
  }).join('');
}

/* ---------- form ---------- */
let form = null;
function fillStageSelect() {
  const sel = $('#stageSelect'); const cur = sel.value;
  sel.innerHTML = STAGES.map(s => `<option value="${s.id}">${esc(s[state.lang])}</option>`).join('');
  if (cur) sel.value = cur;
}
function refreshFormLabels() { if (form) { $('#formTitle').textContent = form.orig ? t('editProject') : t('newProject'); renderFileInfo(); } }

function openForm(p) {
  const orig = p || null;
  const thumb = orig?.thumbnail_url || '';
  const cm = /^cover:(\d+)$/.exec(thumb);
  form = {
    orig,
    thumbType: !thumb || cm ? 'cover' : (storagePathOf(thumb) ? 'upload' : 'url'),
    cover: cm ? +cm[1] : (orig ? coverIndexFor(orig) : Math.floor(Math.random() * 8)),
    newThumbBlob: null, newThumbPreview: '',
    type: orig?.project_type || 'url',
    pptMode: orig?.project_type === 'ppsx' && orig.project_url && !isPptFileUrl(orig.project_url) ? 'link' : 'file',
    newHtml: null, newPpt: null
  };
  const f = $('#pForm');
  fillStageSelect();
  ['title_ar', 'title_en', 'teacher_ar', 'teacher_en', 'desc_ar', 'desc_en'].forEach(k => f.elements[k].value = orig?.[k] || '');
  f.elements.grade.value = orig?.grade && STAGES.some(s => s.id === orig.grade) ? orig.grade : STAGES[0].id;
  $('#imgUrl').value = form.thumbType === 'url' ? thumb : '';
  $('#projUrl').value = orig?.project_type === 'url' ? (orig.project_url || '') : '';
  $('#pptLink').value = form.pptMode === 'link' ? (orig?.project_url || '') : '';
  ['#imgInput', '#htmlInput', '#pptInput'].forEach(s => $(s).value = '');
  $('#formErr').textContent = '';
  refreshFormLabels();
  renderCoverChoices(); setThumbTab(form.thumbType); setProjType(form.type); setPptMode(form.pptMode);
  $('#adminList').classList.add('hidden'); f.classList.remove('hidden');
  $('#adminScroll').scrollTop = 0;
}
function renderCoverChoices() {
  $('#ttCoverPane').innerHTML = COVERS.map((c, i) => `<button type="button" data-cover="${i}" class="tap aspect-video rounded-xl overflow-hidden ring-offset-2 ${form.cover == i ? 'ring-4 ring-sky1' : 'ring-1 ring-slate-200'}">${coverHTML(i, false)}</button>`).join('');
}
function renderThumbPreview() {
  let u = '';
  if (form.thumbType === 'url') u = $('#imgUrl').value.trim();
  else if (form.thumbType === 'upload') u = form.newThumbPreview || (form.orig && storagePathOf(form.orig.thumbnail_url) ? form.orig.thumbnail_url : '');
  else u = 'cover:' + form.cover;
  $('#thumbPreview').innerHTML = thumbHTML({ id: 'x', thumbnail_url: u || ('cover:' + form.cover), project_type: form.type }, false);
}
function setThumbTab(tt) {
  form.thumbType = tt;
  $$('.tt').forEach(b => { const a = b.dataset.tt === tt; b.className = 'tt tap h-12 rounded-xl font-bold ' + (a ? 'bg-navy text-white' : 'bg-slate-100 text-slate-600'); });
  $('#ttCoverPane').classList.toggle('hidden', tt !== 'cover');
  $('#ttUploadPane').classList.toggle('hidden', tt !== 'upload');
  $('#ttUrlPane').classList.toggle('hidden', tt !== 'url');
  renderThumbPreview();
}
function setProjType(pt) {
  form.type = pt;
  $$('.pt').forEach(b => {
    const a = b.dataset.pt === pt;
    const col = b.dataset.pt === 'ppsx' ? (a ? 'border-orange-400 bg-orange-50' : 'border-slate-200 bg-white') : (a ? 'border-sky1 bg-blue-50' : 'border-slate-200 bg-white');
    b.className = 'pt tap rounded-2xl border-2 p-3 sm:p-4 text-start ' + col;
  });
  $('#ptUrlPane').classList.toggle('hidden', pt !== 'url');
  $('#ptHtmlPane').classList.toggle('hidden', pt !== 'html');
  $('#ptPptPane').classList.toggle('hidden', pt !== 'ppsx');
  if (pt === 'ppsx' && form.thumbType === 'cover' && !form.orig) { form.cover = PPT_COVER; renderCoverChoices(); }
  renderThumbPreview();
}
function setPptMode(m) {
  form.pptMode = m;
  $$('.pm').forEach(b => { const a = b.dataset.pm === m; b.className = 'pm tap h-12 rounded-xl font-bold text-sm sm:text-base ' + (a ? 'bg-orange-500 text-white' : 'bg-slate-100 text-slate-600'); });
  $('#pmFilePane').classList.toggle('hidden', m !== 'file');
  $('#pmLinkPane').classList.toggle('hidden', m !== 'link');
}
function fileLine(file, existingUrl) {
  if (file) return `<i class="fa-solid fa-circle-check text-green-500"></i> ${esc(t('fileSelected'))} <b dir="ltr">${esc(file.name)}</b> (${fmtBytes(file.size)})`;
  if (existingUrl) return `<i class="fa-solid fa-cloud text-sky1"></i> ${esc(t('fileCurrent'))} — <a class="text-sky1 underline" href="${esc(existingUrl)}" target="_blank" rel="noopener">${esc(t('viewCurrent'))}</a>`;
  return '';
}
function renderFileInfo() {
  if (!form) return;
  const o = form.orig;
  $('#htmlInfo').innerHTML = fileLine(form.newHtml, o?.project_type === 'html' ? o.project_url : '');
  $('#pptInfo').innerHTML = fileLine(form.newPpt, o?.project_type === 'ppsx' && isPptFileUrl(o.project_url) ? o.project_url : '');
}
function resizeImage(file, max = 1000) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => b ? resolve({ blob: b, preview: c.toDataURL('image/jpeg', 0.7) }) : reject(new Error('blob')), 'image/jpeg', 0.85);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function extractEmbedUrl(text) {
  let s = (text || '').trim();
  const m = /src\s*=\s*["']([^"']+)["']/i.exec(s);
  if (m) s = m[1];
  s = s.replace(/&amp;/g, '&').trim();
  try { const u = new URL(s); if (!/^https?:$/.test(u.protocol)) return null; return u.href; } catch (_) { return null; }
}
function setBusy(on, text = '', sub = '') {
  if (on) { $('#busyText').textContent = text; $('#busySub').textContent = sub; show($('#busy')); }
  else hide($('#busy'));
}

async function submitForm(e) {
  e.preventDefault();
  if (!sb) { $('#formErr').textContent = t('hintLib'); return; }
  const f = $('#pForm'), o = form.orig;
  const val = (k) => f.elements[k].value.trim();
  const err = (m) => { $('#formErr').textContent = m; };
  err('');

  const row = {
    title_ar: val('title_ar') || val('title_en'),
    title_en: val('title_en') || null,
    teacher_ar: val('teacher_ar') || val('teacher_en'),
    teacher_en: val('teacher_en') || null,
    grade: f.elements.grade.value,
    desc_ar: val('desc_ar') || null,
    desc_en: val('desc_en') || null,
    project_type: form.type
  };
  if (!row.title_ar || !row.teacher_ar) return err(t('errName'));

  // ---- validate project source before uploading anything
  let linkUrl = null;
  if (form.type === 'url') {
    linkUrl = normalizeUrl($('#projUrl').value);
    try { const u = new URL(linkUrl); if (!/^https?:$/.test(u.protocol)) throw 0; } catch (_) { return err(t('errUrl')); }
  } else if (form.type === 'html') {
    if (!form.newHtml && !(o?.project_type === 'html' && o.project_url)) return err(t('errHtml'));
  } else if (form.type === 'ppsx') {
    if (form.pptMode === 'file') {
      if (!form.newPpt && !(o?.project_type === 'ppsx' && isPptFileUrl(o.project_url))) return err(t('errPpt'));
    } else {
      linkUrl = extractEmbedUrl($('#pptLink').value);
      if (!linkUrl) return err(t('errPptLink'));
    }
  }

  const uploaded = [];
  try {
    // ---- thumbnail
    if (form.thumbType === 'cover') row.thumbnail_url = 'cover:' + form.cover;
    else if (form.thumbType === 'url') row.thumbnail_url = $('#imgUrl').value.trim() || ('cover:' + form.cover);
    else if (form.newThumbBlob) {
      setBusy(true, t('uploadingImg'), fmtBytes(form.newThumbBlob.size));
      row.thumbnail_url = await uploadToStorage(form.newThumbBlob, 'thumbnails', 'jpg', 'image/jpeg');
      uploaded.push(row.thumbnail_url);
    } else row.thumbnail_url = (o && storagePathOf(o.thumbnail_url)) ? o.thumbnail_url : ('cover:' + form.cover);

    // ---- project file / link
    if (form.type === 'url') row.project_url = linkUrl;
    else if (form.type === 'html') {
      if (form.newHtml) {
        setBusy(true, t('uploadingFile'), form.newHtml.name + ' · ' + fmtBytes(form.newHtml.size));
        row.project_url = await uploadToStorage(form.newHtml, 'html', 'html', 'text/html; charset=utf-8');
        uploaded.push(row.project_url);
      } else row.project_url = o.project_url;
    } else {
      if (form.pptMode === 'link') row.project_url = linkUrl;
      else if (form.newPpt) {
        const ext = ['ppsx', 'pptx', 'pps', 'ppt'].includes(extOf(form.newPpt.name)) ? extOf(form.newPpt.name) : 'ppsx';
        setBusy(true, t('uploadingFile'), form.newPpt.name + ' · ' + fmtBytes(form.newPpt.size));
        row.project_url = await uploadToStorage(form.newPpt, 'presentations', ext, MIME_PPT[ext]);
        uploaded.push(row.project_url);
      } else row.project_url = o.project_url;
    }

    // ---- database
    setBusy(true, t('savingRow'));
    const q = o ? sb.from(PROJECTS_TABLE).update(row).eq('id', o.id) : sb.from(PROJECTS_TABLE).insert(row);
    const { error } = await q;
    if (error) throw error;

    // ---- clean up files that were replaced
    if (o) {
      const stale = [];
      if (o.thumbnail_url !== row.thumbnail_url) stale.push(o.thumbnail_url);
      if (o.project_url !== row.project_url) stale.push(o.project_url);
      await removeFromStorage(stale);
    }
    setBusy(false);
    form = null;
    toast(t('saved'));
    await loadProjects({ silent: true });
    showAdminList();
  } catch (ex) {
    console.error(ex);
    setBusy(false);
    await removeFromStorage(uploaded); // roll back orphan uploads
    err(explain(ex));
  }
}

async function deleteProject(p) {
  if (!(await confirmDialog(t('confirmDelete', { name: pName(p) })))) return;
  setBusy(true, t('deleting'));
  try {
    const { error } = await sb.from(PROJECTS_TABLE).delete().eq('id', p.id);
    if (error) throw error;
    await removeFromStorage([p.thumbnail_url, p.project_url]);
    state.projects = state.projects.filter(x => x.id !== p.id);
    renderAdminList();
    toast(t('deleted'));
    loadProjects({ silent: true });
  } catch (ex) { toast(explain(ex)); }
  finally { setBusy(false); }
}

function decodeDemo() {
  try {
    const bytes = Uint8Array.from(atob($('#demoData').textContent.trim()), c => c.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  } catch (e) { return '<h1>Demo</h1>'; }
}
async function seedDemo() {
  if (!sb) return toast(t('hintLib'));
  setBusy(true, t('uploadingFile'), 'times-table.html');
  const uploaded = [];
  try {
    const htmlUrl = await uploadToStorage(new Blob([decodeDemo()], { type: 'text/html' }), 'html', 'html', 'text/html; charset=utf-8');
    uploaded.push(htmlUrl);
    setBusy(true, t('savingRow'));
    const { error } = await sb.from(PROJECTS_TABLE).insert([
      { title_ar: 'ريشة الجمل', title_en: 'Camel Feather', teacher_ar: 'مشروع تجريبي', teacher_en: 'Sample Project', grade: 'upper',
        desc_ar: 'مثال لمشروع ويب منشور على Vercel يُعرض مباشرة داخل المعرض دون مغادرة المنصة. يمكن تعديله أو حذفه من لوحة التحكم.',
        desc_en: 'A sample web project hosted on Vercel, shown live inside the showcase. Edit or remove it from the admin panel.',
        thumbnail_url: 'cover:0', project_type: 'url', project_url: 'https://camel-feather-one.vercel.app' },
      { title_ar: 'مغامرة جدول الضرب', title_en: 'Times Table Adventure', teacher_ar: 'مشروع تجريبي', teacher_en: 'Sample Project', grade: 'lower',
        desc_ar: 'لعبة تفاعلية لتعلّم جدول الضرب بالنقاط والنجوم — مثال لملف HTML محفوظ في التخزين السحابي.',
        desc_en: 'An interactive times-table game with points and stars — a sample HTML file stored in cloud storage.',
        thumbnail_url: 'cover:6', project_type: 'html', project_url: htmlUrl }
    ]);
    if (error) throw error;
    toast(t('demoAdded'));
    await loadProjects({ silent: true });
  } catch (ex) { await removeFromStorage(uploaded); toast(explain(ex)); }
  finally { setBusy(false); }
}

/* ---------- confirm + toast ---------- */
function confirmDialog(msg) {
  return new Promise(resolve => {
    $('#confirmMsg').textContent = msg; show($('#confirmDlg'));
    const done = (v) => { hide($('#confirmDlg')); $('#confirmYes').onclick = $('#confirmNo').onclick = null; resolve(v); };
    $('#confirmYes').onclick = () => done(true); $('#confirmNo').onclick = () => done(false);
  });
}
let toastT = null;
function toast(msg) { const el = $('#toastInner'); el.textContent = msg; el.classList.remove('hidden', 'pop-in'); void el.offsetWidth; el.classList.add('pop-in'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.add('hidden'), 3200); }

/* ======================= EVENTS ======================= */
function bindEvents() {
  $('#langBtn').addEventListener('click', () => { state.lang = state.lang === 'ar' ? 'en' : 'ar'; applyLang(); });
  $('#logoBtn').addEventListener('click', () => { state.filter = 'all'; renderFilters(); renderGrid(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  $('#adminBtn').addEventListener('click', openPin);
  $('#retryBtn').addEventListener('click', () => { state.loadError = null; renderGrid(); loadProjects(); });
  $('#filters').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; state.filter = b.dataset.f; renderFilters(); renderGrid(); });
  $('#grid').addEventListener('click', e => { const b = e.target.closest('[data-try]'); if (b) openViewer(b.dataset.try); });

  $('#vBack').addEventListener('click', closeViewer);
  $('#vReload').addEventListener('click', () => state.current && mountFrame(state.current));
  $('#vSlowReload').addEventListener('click', () => state.current && mountFrame(state.current));
  $('#idleStay').addEventListener('click', (e) => { e.stopPropagation(); stopWarn(); bumpIdle(); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (isOpen($('#confirmDlg'))) $('#confirmNo').click();
    else if (isOpen($('#pinDlg'))) closePin();
    else if (state.current) closeViewer();
  });

  buildPinPad();
  $('#pinPad').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) pinKey(b.dataset.k); });
  document.addEventListener('keydown', e => { if (isOpen($('#pinDlg'))) { if (/^\d$/.test(e.key)) pinKey(e.key); else if (e.key === 'Backspace') pinKey('⌫'); } });
  $('#pinClose').addEventListener('click', closePin);
  $('#pinDlg').addEventListener('click', e => { if (e.target.id === 'pinDlg') closePin(); });

  $('#loginClose').addEventListener('click', () => { hide($('#loginDlg')); bumpIdle(); });
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: $('#loginEmail').value.trim(), password: $('#loginPass').value });
    if (error) { $('#loginErr').textContent = t('loginErr'); return; }
    $('#loginPass').value = ''; hide($('#loginDlg')); openAdmin();
  });
  $('#logoutBtn').addEventListener('click', async () => { try { await sb.auth.signOut(); } catch (_) {} closeAdmin(); });

  $('#adminClose').addEventListener('click', closeAdmin);
  $('#addBtn').addEventListener('click', () => openForm(null));
  $('#refreshBtn').addEventListener('click', () => loadProjects());
  $('#seedBtn').addEventListener('click', seedDemo);
  $('#adminItems').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.edit) openForm(state.projects.find(p => String(p.id) === b.dataset.edit));
    else if (b.dataset.del) { const p = state.projects.find(x => String(x.id) === b.dataset.del); if (p) deleteProject(p); }
  });
  $('#fsBtn').addEventListener('click', async () => {
    try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); else await document.exitFullscreen(); }
    catch (_) { toast(t('fsErr')); }
  });

  // form
  $('#pForm').addEventListener('submit', submitForm);
  $('#formBack').addEventListener('click', () => { form = null; showAdminList(); });
  $('#formCancel').addEventListener('click', () => { form = null; showAdminList(); });
  $('#thumbTabs').addEventListener('click', e => { const b = e.target.closest('[data-tt]'); if (b) setThumbTab(b.dataset.tt); });
  $('#ttCoverPane').addEventListener('click', e => { const b = e.target.closest('[data-cover]'); if (!b) return; form.cover = +b.dataset.cover; renderCoverChoices(); renderThumbPreview(); });
  $('#imgUrl').addEventListener('input', renderThumbPreview);
  $('#imgInput').addEventListener('change', async e => {
    const file = e.target.files[0]; if (!file) return;
    try { const r = await resizeImage(file); form.newThumbBlob = r.blob; form.newThumbPreview = r.preview; renderThumbPreview(); }
    catch (_) { toast(t('imgErr')); }
  });
  $$('.pt').forEach(b => b.addEventListener('click', () => setProjType(b.dataset.pt)));
  $$('.pm').forEach(b => b.addEventListener('click', () => setPptMode(b.dataset.pm)));
  $('#htmlInput').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    if (!/\.html?$/i.test(file.name)) { $('#formErr').textContent = t('errFileType'); e.target.value = ''; return; }
    form.newHtml = file; $('#formErr').textContent = ''; renderFileInfo();
  });
  $('#pptInput').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    if (!/\.(ppsx|pptx|pps|ppt)$/i.test(file.name)) { $('#formErr').textContent = t('errFileType'); e.target.value = ''; return; }
    form.newPpt = file; $('#formErr').textContent = ''; renderFileInfo();
  });
}

/* ======================= INIT ======================= */
function init() {
  bindEvents();
  const cached = readCache();
  if (cached) { state.projects = cached; state.loaded = true; }
  applyLang();
  if (!sb) { state.loadError = t('hintLib'); if (!state.loaded) renderGrid(); }
  else { loadProjects({ silent: true }); subscribeRealtime(); }
  setInterval(() => { if (!state.current && !anyAdminUI()) loadProjects({ silent: true }); }, 5 * 60 * 1000);
  bumpIdle();
}
init();
})();
